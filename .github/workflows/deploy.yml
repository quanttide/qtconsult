name: Deploy to OSS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: src/studio
        run: flutter pub get

      - name: Build Web
        working-directory: src/studio
        run: flutter build web --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build
          path: src/studio/build/web
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-build
          path: build/web

      - name: Install ossutil
        run: |
          wget https://github.com/aliyun/ossutil/releases/download/1.7.23/ossutil -O ossutil
          chmod +x ossutil

      - name: Upload to OSS
        run: ./ossutil cp --recursive build/web/ oss://qtconsult-studio/ --endpoint oss-cn-hangzhou.aliyuncs.com --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
