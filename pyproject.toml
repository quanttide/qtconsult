[project]
name = "qtconsult"
version = "0.1.0"
description = "量潮咨询"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
